name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: cup-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Prepare pinned dependencies
    uses: ./.github/workflows/dependencies.yml
    with:
      target: all

  quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: make quality
        env:
          CUP_TEST_REPOSITORY_TIMEOUT: 300

  posix:
    name: Source tests (${{ matrix.platform }})
    needs: dependencies
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            family: linux
            profile: gcc
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            family: linux
            profile: gcc
          - platform: macos-x64
            runner: macos-15-intel
            family: macos
            profile: apple-clang
          - platform: macos-arm64
            runner: macos-15
            family: macos
            profile: apple-clang
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare source-test toolchain
        env:
          FAMILY: ${{ matrix.family }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/ci/prepare-posix.sh source
      - id: cache
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          root="$HOME/deps/${{ matrix.platform }}"
          key=$(scripts/dependencies/verify.sh '${{ matrix.platform }}' --print-cache-key)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5.0.5
        with:
          path: |
            ${{ steps.cache.outputs.root }}/.cup-dependencies-root
            ${{ steps.cache.outputs.prefix }}
          key: ${{ steps.cache.outputs.key }}
          fail-on-cache-miss: true
      - name: Run source tests
        env:
          PLATFORM: ${{ matrix.platform }}
          FAMILY: ${{ matrix.family }}
          DEPS_ROOT: ${{ steps.cache.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache.outputs.prefix }}
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
          CUP_SOURCE_BUILD_CONFIG: ${{ runner.temp }}/build-config.txt
          CUP_CI_BUILD_REPOSITORY_TESTS: 1
        run: scripts/ci/source-posix.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cup-source-build-config-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-config.txt
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Source tests (windows-x64)
    needs: dependencies
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            ca-certificates
            diffutils
            curl
            file
            git
            gcc
            make
            openssl
            perl
            tar
            xz
          pacboy: >-
            gcc:p
            binutils:p
            pkgconf:p
      - id: cache
        shell: msys2 {0}
        env:
          CUP_DEPENDENCY_PROFILE: ucrt64-gcc
        run: |
          root="$HOME/deps/windows-x64"
          key=$(scripts/dependencies/verify.sh windows-x64 --print-cache-key)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "cache_root=$(cygpath -m "$root")" >> "$GITHUB_OUTPUT"
          echo "cache_prefix=$(cygpath -m "$root/install")" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5.0.5
        with:
          path: |
            ${{ steps.cache.outputs.cache_root }}/.cup-dependencies-root
            ${{ steps.cache.outputs.cache_prefix }}
          key: ${{ steps.cache.outputs.key }}
          fail-on-cache-miss: true
      - name: Run source tests
        shell: msys2 {0}
        env:
          CUP_DEPENDENCY_PROFILE: ucrt64-gcc
          DEPS_ROOT: ${{ steps.cache.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache.outputs.prefix }}
          CUP_TEST_UNIT_TIMEOUT: 300
        run: |
          set -euo pipefail
          make PLATFORM=windows-x64 DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            CUP_INTERNAL_DEPS_TARGET=deps-check test
          make PLATFORM=windows-x64 DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            CUP_INTERNAL_DEPS_TARGET=deps-check check-development
          CUP_TEST_PLATFORM=windows-x64 DEPS_PREFIX="$DEPS_PREFIX" \
            ./tests/repository/reproducibility.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cup-source-build-config-windows-x64-attempt-${{ github.run_attempt }}
          path: build/windows-x64/development/build-config.txt
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Coverage (${{ matrix.platform }})
    needs: dependencies
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            family: linux
            profile: gcc
            variant: linux-x64
            compiler: gcc
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            family: linux
            profile: gcc
            variant: linux-arm64
            compiler: gcc
          - platform: macos-x64
            runner: macos-15-intel
            family: macos
            profile: apple-clang
            variant: macos-x64
            compiler: clang
          - platform: macos-arm64
            runner: macos-15
            family: macos
            profile: apple-clang
            variant: macos-arm64
            compiler: clang
          - platform: windows-x64
            runner: windows-2025
            family: windows
            profile: ucrt64-gcc
            variant: windows-x64
            compiler: gcc
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2.32.0
        if: matrix.family == 'windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            ca-certificates
            diffutils
            coreutils
            curl
            file
            git
            gcc
            make
            openssl
            perl
            tar
            xz
          pacboy: >-
            gcc:p
            binutils:p
            gcovr:p
            pkgconf:p
      - name: Prepare POSIX coverage toolchain
        if: matrix.family != 'windows'
        env:
          FAMILY: ${{ matrix.family }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/ci/prepare-posix.sh coverage
      - id: cache-posix
        if: matrix.family != 'windows'
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          root="$HOME/deps/${{ matrix.variant }}"
          key=$(scripts/dependencies/verify.sh '${{ matrix.platform }}' --print-cache-key)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - id: cache-windows
        if: matrix.family == 'windows'
        shell: msys2 {0}
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          root="$HOME/deps/${{ matrix.variant }}"
          key=$(scripts/dependencies/verify.sh '${{ matrix.platform }}' --print-cache-key)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "cache_root=$(cygpath -m "$root")" >> "$GITHUB_OUTPUT"
          echo "cache_prefix=$(cygpath -m "$root/install")" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5.0.5
        if: matrix.family != 'windows'
        with:
          path: |
            ${{ steps.cache-posix.outputs.root }}/.cup-dependencies-root
            ${{ steps.cache-posix.outputs.prefix }}
          key: ${{ steps.cache-posix.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/cache@v5.0.5
        if: matrix.family == 'windows'
        with:
          path: |
            ${{ steps.cache-windows.outputs.cache_root }}/.cup-dependencies-root
            ${{ steps.cache-windows.outputs.cache_prefix }}
          key: ${{ steps.cache-windows.outputs.key }}
          fail-on-cache-miss: true
      - name: Collect POSIX coverage
        if: matrix.family != 'windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CUP_TEST_PLATFORM: ${{ matrix.platform }}
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
          DEPS_ROOT: ${{ steps.cache-posix.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache-posix.outputs.prefix }}
          CC: ${{ matrix.compiler }}
          CUP_COVERAGE_MIN_LINES: 85
          CUP_COVERAGE_MIN_BRANCHES: 70
          CUP_COVERAGE_MIN_FUNCTIONS: 97
        run: |
          set -euo pipefail
          tests/runners/coverage.sh
          make PLATFORM="$PLATFORM" DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            CC="$CC" CUP_BUILD_CONFIGURATION=coverage _check-binary

      - name: Collect Windows coverage
        if: matrix.family == 'windows'
        shell: msys2 {0}
        env:
          PLATFORM: windows-x64
          CUP_TEST_PLATFORM: windows-x64
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
          DEPS_ROOT: ${{ steps.cache-windows.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache-windows.outputs.prefix }}
          CC: gcc
          CUP_COVERAGE_MIN_LINES: 85
          CUP_COVERAGE_MIN_BRANCHES: 70
          CUP_COVERAGE_MIN_FUNCTIONS: 97
        run: |
          set -euo pipefail
          tests/runners/coverage.sh
          make PLATFORM=windows-x64 DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            CC=gcc WINDRES=windres CUP_BUILD_CONFIGURATION=coverage _check-binary
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cup-coverage-${{ matrix.platform }}
          path: build/reports/coverage/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    name: Sanitizers (${{ matrix.platform }})
    needs: dependencies
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            family: linux
            profile: gcc
            variant: linux-x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            family: linux
            profile: gcc
            variant: linux-arm64
          - platform: macos-x64
            runner: macos-15-intel
            family: macos
            profile: apple-clang
            variant: macos-x64
          - platform: macos-arm64
            runner: macos-15
            family: macos
            profile: apple-clang
            variant: macos-arm64
          - platform: windows-x64
            runner: windows-2025
            family: windows
            profile: clang64
            variant: windows-x64-clang64
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2.32.0
        if: matrix.family == 'windows'
        with:
          msystem: CLANG64
          update: true
          install: >-
            ca-certificates
            diffutils
            coreutils
            curl
            file
            git
            gcc
            make
            openssl
            perl
            tar
            xz
          pacboy: >-
            clang:p
            compiler-rt:p
            llvm:p
            pkgconf:p
      - name: Prepare POSIX sanitizer toolchain
        if: matrix.family != 'windows'
        env:
          FAMILY: ${{ matrix.family }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/ci/prepare-posix.sh sanitizers
      - id: cache-posix
        if: matrix.family != 'windows'
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          root="$HOME/deps/${{ matrix.variant }}"
          key=$(scripts/dependencies/verify.sh '${{ matrix.platform }}' --print-cache-key)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - id: cache-windows
        if: matrix.family == 'windows'
        shell: msys2 {0}
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          root="$HOME/deps/${{ matrix.variant }}"
          key=$(scripts/dependencies/verify.sh '${{ matrix.platform }}' --print-cache-key)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "cache_root=$(cygpath -m "$root")" >> "$GITHUB_OUTPUT"
          echo "cache_prefix=$(cygpath -m "$root/install")" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5.0.5
        if: matrix.family != 'windows'
        with:
          path: |
            ${{ steps.cache-posix.outputs.root }}/.cup-dependencies-root
            ${{ steps.cache-posix.outputs.prefix }}
          key: ${{ steps.cache-posix.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/cache@v5.0.5
        if: matrix.family == 'windows'
        with:
          path: |
            ${{ steps.cache-windows.outputs.cache_root }}/.cup-dependencies-root
            ${{ steps.cache-windows.outputs.cache_prefix }}
          key: ${{ steps.cache-windows.outputs.key }}
          fail-on-cache-miss: true
      - name: Run POSIX sanitizer tests
        if: matrix.family != 'windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CUP_TEST_PLATFORM: ${{ matrix.platform }}
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
          DEPS_ROOT: ${{ steps.cache-posix.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache-posix.outputs.prefix }}
          CC: clang
        run: |
          set -euo pipefail
          tests/runners/sanitizers.sh
          make PLATFORM="$PLATFORM" DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            CC=clang CUP_BUILD_CONFIGURATION=sanitizers _check-binary

      - name: Run Windows sanitizer tests
        if: matrix.family == 'windows'
        shell: msys2 {0}
        env:
          PLATFORM: windows-x64
          CUP_TEST_PLATFORM: windows-x64
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
          DEPS_ROOT: ${{ steps.cache-windows.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache-windows.outputs.prefix }}
          CC: clang
        run: |
          set -euo pipefail
          tests/runners/sanitizers.sh
          make PLATFORM=windows-x64 DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            CC=clang WINDRES=llvm-windres CUP_BUILD_CONFIGURATION=sanitizers _check-binary
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cup-sanitizers-${{ matrix.platform }}
          path: build/reports/sanitizers/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 30

  gate:
    name: Tests gate
    if: ${{ !cancelled() }}
    needs:
      - dependencies
      - quality
      - posix
      - windows
      - coverage
      - sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify required test jobs
        env:
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          POSIX_RESULT: ${{ needs.posix.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
        run: |
          set -euo pipefail
          for result in "$DEPENDENCIES_RESULT" "$QUALITY_RESULT" "$POSIX_RESULT" \
            "$WINDOWS_RESULT" "$COVERAGE_RESULT" "$SANITIZERS_RESULT"; do
            if [ "$result" != success ]; then
              echo "A required Tests job did not succeed: $result" >&2
              exit 1
            fi
          done
