name: Dependencies

on:
  workflow_call:
    inputs:
      target:
        description: Dependency platform/profile target, or all
        required: false
        default: all
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: Dependency platform/profile target
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x64-gcc
          - linux-arm64-gcc
          - macos-x64-apple-clang
          - macos-arm64-apple-clang
          - windows-x64-ucrt64
          - windows-x64-clang64

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  plan:
    name: Resolve dependency targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - id: plan
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          case "$REQUESTED_TARGET" in
            all)
              targets='["linux-x64-gcc","linux-arm64-gcc","macos-x64-apple-clang",'
              targets=$targets'"macos-arm64-apple-clang","windows-x64-ucrt64","windows-x64-clang64"]'
              ;;
            linux-x64-gcc|linux-arm64-gcc|macos-x64-apple-clang|\
              macos-arm64-apple-clang|windows-x64-ucrt64|windows-x64-clang64)
              targets="[\"$REQUESTED_TARGET\"]"
              ;;
            *)
              echo "Unsupported dependency target: $REQUESTED_TARGET" >&2
              exit 2
              ;;
          esac
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare ${{ matrix.target }}
    needs: plan
    concurrency:
      group: cup-dependencies-${{ matrix.target }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: >-
      ${{
        matrix.target == 'linux-x64-gcc' && 'ubuntu-24.04' ||
        matrix.target == 'linux-arm64-gcc' && 'ubuntu-24.04-arm' ||
        matrix.target == 'macos-x64-apple-clang' && 'macos-15-intel' ||
        matrix.target == 'macos-arm64-apple-clang' && 'macos-15' ||
        'windows-2025'
      }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2.32.0
        if: matrix.target == 'windows-x64-ucrt64'
        with:
          msystem: UCRT64
          update: true
          install: >-
            ca-certificates
            diffutils
            curl
            file
            git
            gcc
            make
            perl
            tar
            xz
          pacboy: >-
            gcc:p
            binutils:p
            pkgconf:p

      - uses: msys2/setup-msys2@v2.32.0
        if: matrix.target == 'windows-x64-clang64'
        with:
          msystem: CLANG64
          update: true
          install: >-
            ca-certificates
            diffutils
            curl
            file
            git
            gcc
            make
            perl
            tar
            xz
          pacboy: >-
            clang:p
            compiler-rt:p
            llvm:p
            pkgconf:p

      - id: posix-target
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            linux-x64-gcc) platform=linux-x64; profile=gcc; family=linux ;;
            linux-arm64-gcc) platform=linux-arm64; profile=gcc; family=linux ;;
            macos-x64-apple-clang) platform=macos-x64; profile=apple-clang; family=macos ;;
            macos-arm64-apple-clang) platform=macos-arm64; profile=apple-clang; family=macos ;;
            *) echo "Unsupported POSIX target: $TARGET" >&2; exit 2 ;;
          esac
          root="$HOME/deps/$platform"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "family=$family" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"

      - name: Prepare POSIX dependency toolchain
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        env:
          FAMILY: ${{ steps.posix-target.outputs.family }}
          PLATFORM: ${{ steps.posix-target.outputs.platform }}
        run: scripts/ci/prepare-posix.sh dependencies

      - id: posix-cache
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        env:
          CUP_DEPENDENCY_PROFILE: ${{ steps.posix-target.outputs.profile }}
        run: |
          key=$(scripts/dependencies/verify.sh '${{ steps.posix-target.outputs.platform }}' --print-cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - id: restore-posix
        uses: actions/cache@v5.0.5
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        with:
          path: |
            ${{ steps.posix-target.outputs.root }}/.cup-dependencies-root
            ${{ steps.posix-target.outputs.prefix }}
          key: ${{ steps.posix-cache.outputs.key }}

      - name: Build or validate POSIX prefix
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        env:
          CUP_DEPENDENCY_PROFILE: ${{ steps.posix-target.outputs.profile }}
          CACHE_HIT: ${{ steps.restore-posix.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" = true ]; then
            make PLATFORM='${{ steps.posix-target.outputs.platform }}' \
              DEPS_ROOT='${{ steps.posix-target.outputs.root }}' \
              DEPS_PREFIX='${{ steps.posix-target.outputs.prefix }}' deps-check
          else
            JOBS=4 make PLATFORM='${{ steps.posix-target.outputs.platform }}' \
              DEPS_ROOT='${{ steps.posix-target.outputs.root }}' \
              DEPS_PREFIX='${{ steps.posix-target.outputs.prefix }}' deps
            make PLATFORM='${{ steps.posix-target.outputs.platform }}' \
              DEPS_ROOT='${{ steps.posix-target.outputs.root }}' \
              DEPS_PREFIX='${{ steps.posix-target.outputs.prefix }}' deps-check
          fi

      - id: windows-target
        if: ${{ startsWith(matrix.target, 'windows-') }}
        shell: msys2 {0}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            windows-x64-ucrt64) profile=ucrt64-gcc; variant=windows-x64 ;;
            windows-x64-clang64) profile=clang64; variant=windows-x64-clang64 ;;
            *) echo "Unsupported Windows target: $TARGET" >&2; exit 2 ;;
          esac
          root="$HOME/deps/$variant"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "cache_root=$(cygpath -m "$root")" >> "$GITHUB_OUTPUT"
          echo "cache_prefix=$(cygpath -m "$root/install")" >> "$GITHUB_OUTPUT"

      - id: windows-cache
        if: ${{ startsWith(matrix.target, 'windows-') }}
        shell: msys2 {0}
        env:
          CUP_DEPENDENCY_PROFILE: ${{ steps.windows-target.outputs.profile }}
        run: |
          key=$(scripts/dependencies/verify.sh windows-x64 --print-cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - id: restore-windows
        uses: actions/cache@v5.0.5
        if: ${{ startsWith(matrix.target, 'windows-') }}
        with:
          path: |
            ${{ steps.windows-target.outputs.cache_root }}/.cup-dependencies-root
            ${{ steps.windows-target.outputs.cache_prefix }}
          key: ${{ steps.windows-cache.outputs.key }}

      - name: Build or validate Windows prefix
        if: ${{ startsWith(matrix.target, 'windows-') }}
        shell: msys2 {0}
        env:
          CUP_DEPENDENCY_PROFILE: ${{ steps.windows-target.outputs.profile }}
          CACHE_HIT: ${{ steps.restore-windows.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" = true ]; then
            make PLATFORM=windows-x64 DEPS_ROOT='${{ steps.windows-target.outputs.root }}' \
              DEPS_PREFIX='${{ steps.windows-target.outputs.prefix }}' deps-check
          else
            JOBS=4 make PLATFORM=windows-x64 DEPS_ROOT='${{ steps.windows-target.outputs.root }}' \
              DEPS_PREFIX='${{ steps.windows-target.outputs.prefix }}' deps
            make PLATFORM=windows-x64 DEPS_ROOT='${{ steps.windows-target.outputs.root }}' \
              DEPS_PREFIX='${{ steps.windows-target.outputs.prefix }}' deps-check
          fi

      - name: Write POSIX dependency evidence
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ steps.posix-target.outputs.platform }}
          PROFILE: ${{ steps.posix-target.outputs.profile }}
          PREFIX: ${{ steps.posix-target.outputs.prefix }}
          CACHE_KEY: ${{ steps.posix-cache.outputs.key }}
          ARTIFACT_NAME: cup-dependency-evidence-${{ matrix.target }}-attempt-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          scripts/ci/write-dependency-evidence.sh \
            "$RUNNER_TEMP/cup-dependency-evidence/$TARGET" "$TARGET" "$PLATFORM" "$PROFILE" \
            "$PREFIX" "$CACHE_KEY" '${{ github.repository }}' '${{ github.sha }}' \
            '${{ github.run_id }}' '${{ github.run_attempt }}' "$ARTIFACT_NAME"

      - name: Write Windows dependency evidence
        if: ${{ startsWith(matrix.target, 'windows-') }}
        shell: msys2 {0}
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: windows-x64
          PROFILE: ${{ steps.windows-target.outputs.profile }}
          PREFIX: ${{ steps.windows-target.outputs.prefix }}
          CACHE_KEY: ${{ steps.windows-cache.outputs.key }}
          ARTIFACT_NAME: cup-dependency-evidence-${{ matrix.target }}-attempt-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          evidence_root=$(cygpath -u "$RUNNER_TEMP")/cup-dependency-evidence
          scripts/ci/write-dependency-evidence.sh \
            "$evidence_root/$TARGET" "$TARGET" "$PLATFORM" "$PROFILE" \
            "$PREFIX" "$CACHE_KEY" '${{ github.repository }}' '${{ github.sha }}' \
            '${{ github.run_id }}' '${{ github.run_attempt }}' "$ARTIFACT_NAME"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cup-dependency-evidence-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cup-dependency-evidence/${{ matrix.target }}/evidence.txt
          if-no-files-found: error
          retention-days: 14
