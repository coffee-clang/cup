name: Debug artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: cup-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Prepare pinned dependencies
    uses: ./.github/workflows/dependencies.yml
    with:
      target: all

  posix:
    name: Debug build (${{ matrix.platform }})
    needs: dependencies
    if: always()
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            family: linux
            profile: gcc
            dependency_target: linux-x64-gcc
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            family: linux
            profile: gcc
            dependency_target: linux-arm64-gcc
          - platform: macos-x64
            runner: macos-15-intel
            family: macos
            profile: apple-clang
            dependency_target: macos-x64-apple-clang
          - platform: macos-arm64
            runner: macos-15
            family: macos
            profile: apple-clang
            dependency_target: macos-arm64-apple-clang
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare POSIX debug toolchain
        env:
          FAMILY: ${{ matrix.family }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/ci/prepare-posix.sh debug
      - id: cache
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          root="$HOME/deps/${{ matrix.platform }}"
          key=$(scripts/dependencies/verify.sh '${{ matrix.platform }}' --print-cache-key)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5.0.5
        with:
          path: |
            ${{ steps.cache.outputs.root }}/.cup-dependencies-root
            ${{ steps.cache.outputs.prefix }}
          key: ${{ steps.cache.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-dependency-evidence-${{ matrix.dependency_target }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cup-dependency-evidence/${{ matrix.dependency_target }}
      - name: Build and package debug artifact
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
          DEPS_ROOT: ${{ steps.cache.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache.outputs.prefix }}
        run: |
          set -euo pipefail
          scripts/ci/verify-dependency-evidence.sh \
            "$RUNNER_TEMP/cup-dependency-evidence/${{ matrix.dependency_target }}/evidence.txt" \
            '${{ matrix.dependency_target }}' '${{ matrix.platform }}' \
            '${{ matrix.profile }}' "$DEPS_PREFIX"
          make PLATFORM='${{ matrix.platform }}' DEPS_ROOT="$DEPS_ROOT" \
            DEPS_PREFIX="$DEPS_PREFIX" debug-artifact
          root=build/finalized/${{ matrix.platform }}/debug
          "$root/bin/cup" --version
          "$root/bin/cup" help >/dev/null
          mkdir -p build/debug-artifacts
          tar -czf build/debug-artifacts/cup-debug-${{ matrix.platform }}.tar.gz \
            -C "$root" .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cup-debug-${{ matrix.platform }}
          path: build/debug-artifacts/cup-debug-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Debug build (windows-x64)
    needs: dependencies
    if: always()
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            ca-certificates
            diffutils
            curl
            file
            git
            gcc
            make
            openssl
            perl
            tar
            xz
          pacboy: >-
            gcc:p
            binutils:p
            pkgconf:p
      - id: cache
        shell: msys2 {0}
        env:
          CUP_DEPENDENCY_PROFILE: ucrt64-gcc
        run: |
          root="$HOME/deps/windows-x64"
          key=$(scripts/dependencies/verify.sh windows-x64 --print-cache-key)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "cache_root=$(cygpath -m "$root")" >> "$GITHUB_OUTPUT"
          echo "cache_prefix=$(cygpath -m "$root/install")" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5.0.5
        with:
          path: |
            ${{ steps.cache.outputs.cache_root }}/.cup-dependencies-root
            ${{ steps.cache.outputs.cache_prefix }}
          key: ${{ steps.cache.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-dependency-evidence-windows-x64-ucrt64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cup-dependency-evidence/windows-x64-ucrt64
      - name: Build and package debug artifact
        shell: msys2 {0}
        env:
          CUP_DEPENDENCY_PROFILE: ucrt64-gcc
          DEPS_ROOT: ${{ steps.cache.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache.outputs.prefix }}
        run: |
          set -euo pipefail
          evidence_root=$(cygpath -u "$RUNNER_TEMP")/cup-dependency-evidence
          scripts/ci/verify-dependency-evidence.sh \
            "$evidence_root/windows-x64-ucrt64/evidence.txt" \
            windows-x64-ucrt64 windows-x64 ucrt64-gcc "$DEPS_PREFIX"
          make PLATFORM=windows-x64 DEPS_ROOT="$DEPS_ROOT" \
            DEPS_PREFIX="$DEPS_PREFIX" debug-artifact
          root=build/finalized/windows-x64/debug
          "$root/bin/cup.exe" --version
          "$root/bin/cup.exe" help >/dev/null
          mkdir -p build/debug-artifacts
          tar -czf build/debug-artifacts/cup-debug-windows-x64.tar.gz -C "$root" .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cup-debug-windows-x64
          path: build/debug-artifacts/cup-debug-windows-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
