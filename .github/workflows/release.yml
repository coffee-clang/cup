name: Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: cup-release
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  metadata:
    name: Resolve tested release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      tests_run_id: ${{ steps.tests.outputs.run_id }}
      tests_run_attempt: ${{ steps.tests.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: metadata
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || {
            echo "Release must be dispatched from main, got $GITHUB_REF" >&2
            exit 1
          }
          version=$(scripts/version.sh base)
          sha=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: tests
        name: Resolve successful Tests attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          gh api \
            "repos/$REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$SHA&status=success&per_page=100" \
            > "$RUNNER_TEMP/tests-runs.json"
          record=$(jq -r --arg sha "$SHA" '
            [.workflow_runs[] |
              select(.head_sha == $sha and .status == "completed" and
                .conclusion == "success" and
                (.event == "push" or .event == "workflow_dispatch"))] |
            sort_by(.id) | reverse | first |
            if . == null then empty else [.id, .run_attempt] | @tsv end
          ' "$RUNNER_TEMP/tests-runs.json")
          [ -n "$record" ] || {
            echo "No successful Tests run exists for commit $SHA." >&2
            exit 1
          }
          IFS=$'\t' read -r run_id run_attempt <<< "$record"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

  common:
    name: Build common release assets
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
      - name: Build exact common asset set
        env:
          CUP_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          CUP_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          CUP_RELEASE_COMMIT: ${{ needs.metadata.outputs.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          TESTS_RUN_ID: ${{ needs.metadata.outputs.tests_run_id }}
          TESTS_RUN_ATTEMPT: ${{ needs.metadata.outputs.tests_run_attempt }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: make release-common-assets
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cup-release-common
          path: build/release/common/public
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  candidate:
    name: Build and test candidate (${{ matrix.platform }})
    needs:
      - metadata
      - common
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            family: linux
            profile: gcc
            compiler: gcc
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            family: linux
            profile: gcc
            compiler: gcc
          - platform: macos-x64
            runner: macos-15-intel
            family: macos
            profile: apple-clang
            compiler: clang
          - platform: macos-arm64
            runner: macos-15
            family: macos
            profile: apple-clang
            compiler: clang
          - platform: windows-x64
            runner: windows-2025
            family: windows
            profile: ucrt64-gcc
            compiler: gcc
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2.32.0
        if: matrix.family == 'windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            ca-certificates
            diffutils
            curl
            file
            git
            gcc
            make
            openssl
            perl
            tar
            xz
          pacboy: >-
            gcc:p
            binutils:p
            pkgconf:p

      - name: Prepare POSIX release toolchain
        if: matrix.family != 'windows'
        env:
          FAMILY: ${{ matrix.family }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/ci/prepare-posix.sh release

      - id: cache-posix
        if: matrix.family != 'windows'
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          root="$HOME/deps/${{ matrix.platform }}"
          key=$(scripts/dependencies/verify.sh '${{ matrix.platform }}' --print-cache-key)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - id: cache-windows
        if: matrix.family == 'windows'
        shell: msys2 {0}
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          root="$HOME/deps/windows-x64"
          key=$(scripts/dependencies/verify.sh windows-x64 --print-cache-key)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "cache_root=$(cygpath -m "$root")" >> "$GITHUB_OUTPUT"
          echo "cache_prefix=$(cygpath -m "$root/install")" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5.0.5
        if: matrix.family != 'windows'
        with:
          path: |
            ${{ steps.cache-posix.outputs.root }}/.cup-dependencies-root
            ${{ steps.cache-posix.outputs.prefix }}
          key: ${{ steps.cache-posix.outputs.key }}
          fail-on-cache-miss: true

      - uses: actions/cache@v5.0.5
        if: matrix.family == 'windows'
        with:
          path: |
            ${{ steps.cache-windows.outputs.cache_root }}/.cup-dependencies-root
            ${{ steps.cache-windows.outputs.cache_prefix }}
          key: ${{ steps.cache-windows.outputs.key }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-source-build-config-${{ matrix.platform }}-attempt-${{ needs.metadata.outputs.tests_run_attempt }}
          path: ${{ runner.temp }}/cup-release-inputs/source/${{ matrix.platform }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.metadata.outputs.tests_run_id }}

      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-common
          path: ${{ runner.temp }}/cup-release-inputs/common

      - name: Verify and build POSIX candidate
        if: matrix.family != 'windows'
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
          DEPS_ROOT: ${{ steps.cache-posix.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache-posix.outputs.prefix }}
          CUP_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          CUP_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          CUP_RELEASE_COMMIT: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/cup-release-inputs"
          make PLATFORM='${{ matrix.platform }}' CC='${{ matrix.compiler }}' \
            DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            RELEASE_COMMON_DIR="$inputs/common" release-candidate
          scripts/ci/verify-source-build-config.sh \
            "$inputs/source/${{ matrix.platform }}/build-config.txt" \
            build/finalized/${{ matrix.platform }}/release/build-config.txt \
            '${{ matrix.platform }}'

      - name: Verify and build Windows candidate
        if: matrix.family == 'windows'
        shell: msys2 {0}
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
          DEPS_ROOT: ${{ steps.cache-windows.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache-windows.outputs.prefix }}
          CUP_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          CUP_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          CUP_RELEASE_COMMIT: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          inputs=$(cygpath -u "$RUNNER_TEMP")/cup-release-inputs
          make PLATFORM=windows-x64 CC=gcc WINDRES=windres \
            DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            RELEASE_COMMON_DIR="$inputs/common" release-candidate
          scripts/ci/verify-source-build-config.sh \
            "$inputs/source/windows-x64/build-config.txt" \
            build/finalized/windows-x64/release/build-config.txt windows-x64

      - name: Assemble and test POSIX candidate
        if: matrix.family != 'windows'
        env:
          DEPS_ROOT: ${{ steps.cache-posix.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache-posix.outputs.prefix }}
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/cup-release-inputs"
          candidate="$RUNNER_TEMP/cup-release-${{ matrix.platform }}"
          scripts/release/assemble-candidate.sh "$candidate" \
            "$inputs/common" \
            "$PWD/build/release/platforms/${{ matrix.platform }}/public"
          make PLATFORM='${{ matrix.platform }}' CC='${{ matrix.compiler }}' \
            DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            CUP_TEST_CONFIGURATION=release RELEASE_DIR="$candidate" test-release

      - name: Assemble and test Windows candidate
        if: matrix.family == 'windows'
        shell: msys2 {0}
        env:
          DEPS_ROOT: ${{ steps.cache-windows.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache-windows.outputs.prefix }}
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          inputs=$(cygpath -u "$RUNNER_TEMP")/cup-release-inputs
          candidate=$(cygpath -u "$RUNNER_TEMP")/cup-release-windows-x64
          scripts/release/assemble-candidate.sh "$candidate" \
            "$inputs/common" \
            "$PWD/build/release/platforms/windows-x64/public"
          make PLATFORM=windows-x64 CC=gcc WINDRES=windres \
            DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            CUP_TEST_CONFIGURATION=release RELEASE_DIR="$candidate" test-release

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cup-release-${{ matrix.platform }}
          path: build/release/platforms/${{ matrix.platform }}/public
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cup-symbols-${{ matrix.platform }}
          path: build/release/platforms/${{ matrix.platform }}/symbols
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish:
    name: Publish exact candidate
    needs:
      - metadata
      - common
      - candidate
    if: ${{ needs.candidate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-common
          path: ${{ runner.temp }}/cup-release-downloads/common
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-linux-x64
          path: ${{ runner.temp }}/cup-release-downloads/linux-x64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-linux-arm64
          path: ${{ runner.temp }}/cup-release-downloads/linux-arm64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-macos-x64
          path: ${{ runner.temp }}/cup-release-downloads/macos-x64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-macos-arm64
          path: ${{ runner.temp }}/cup-release-downloads/macos-arm64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-windows-x64
          path: ${{ runner.temp }}/cup-release-downloads/windows-x64

      - name: Assemble exact flat candidate
        run: |
          set -euo pipefail
          scripts/release/assemble-candidate.sh "$RUNNER_TEMP/cup-release-candidate" \
            "$RUNNER_TEMP/cup-release-downloads/common" \
            "$RUNNER_TEMP/cup-release-downloads/linux-x64" \
            "$RUNNER_TEMP/cup-release-downloads/linux-arm64" \
            "$RUNNER_TEMP/cup-release-downloads/macos-x64" \
            "$RUNNER_TEMP/cup-release-downloads/macos-arm64" \
            "$RUNNER_TEMP/cup-release-downloads/windows-x64"

      - name: Publish or resume release
        env:
          GH_TOKEN: ${{ secrets.CUP_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ vars.CUP_RELEASE_REPOSITORY || github.repository }}
          RELEASE_TARGET: ${{ vars.CUP_RELEASE_TARGET }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
          SHA: ${{ needs.metadata.outputs.sha }}
          TESTS_RUN_ID: ${{ needs.metadata.outputs.tests_run_id }}
          TESTS_RUN_ATTEMPT: ${{ needs.metadata.outputs.tests_run_attempt }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: scripts/release/publish.sh "$RUNNER_TEMP/cup-release-candidate"
