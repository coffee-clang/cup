name: Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: cup-release
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  metadata:
    name: Resolve tested release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      tests_run_id: ${{ steps.tests.outputs.run_id }}
      tests_run_attempt: ${{ steps.tests.outputs.run_attempt }}
      tests_run_url: ${{ steps.tests.outputs.run_url }}
      tests_evidence_index_sha256: ${{ steps.evidence.outputs.index_sha256 }}
      candidate_matrix: ${{ steps.evidence.outputs.candidate_matrix }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: metadata
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || {
            echo "Release must be dispatched from main, got $GITHUB_REF" >&2
            exit 1
          }
          version=$(scripts/version.sh base)
          sha=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: tests
        name: Resolve successful Tests attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          gh api \
            "repos/$REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$SHA&status=success&per_page=100" \
            > "$RUNNER_TEMP/tests-runs.json"
          record=$(jq -r --arg sha "$SHA" '
            [.workflow_runs[] |
              select(.head_sha == $sha and .status == "completed" and
                .conclusion == "success" and
                (.event == "push" or .event == "workflow_dispatch"))] |
            sort_by(.id) | reverse | first |
            if . == null then empty else [.id, .run_attempt, .html_url] | @tsv end
          ' "$RUNNER_TEMP/tests-runs.json")
          [ -n "$record" ] || {
            echo "No successful Tests run exists for commit $SHA." >&2
            exit 1
          }
          IFS=$'\t' read -r run_id run_attempt run_url <<< "$record"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-tests-evidence-index-attempt-${{ steps.tests.outputs.run_attempt }}
          path: ${{ runner.temp }}/tests-evidence-index
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.tests.outputs.run_id }}
      - id: evidence
        name: Verify exact Tests artifact identities
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.metadata.outputs.sha }}
          RUN_ID: ${{ steps.tests.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.tests.outputs.run_attempt }}
        run: |
          set -euo pipefail
          index="$RUNNER_TEMP/tests-evidence-index/index.txt"
          scripts/ci/verify-tests-evidence-index.sh \
            "$index" "$REPOSITORY" "$SHA" "$RUN_ID" "$RUN_ATTEMPT"
          artifact_id() {
            scripts/ci/verify-tests-evidence-index.sh \
              "$index" "$REPOSITORY" "$SHA" "$RUN_ID" "$RUN_ATTEMPT" \
              --artifact-id "$1"
          }
          dep_linux_x64=$(artifact_id "cup-dependency-evidence-linux-x64-gcc-attempt-$RUN_ATTEMPT")
          dep_linux_arm64=$(artifact_id "cup-dependency-evidence-linux-arm64-gcc-attempt-$RUN_ATTEMPT")
          dep_macos_x64=$(artifact_id "cup-dependency-evidence-macos-x64-apple-clang-attempt-$RUN_ATTEMPT")
          dep_macos_arm64=$(artifact_id "cup-dependency-evidence-macos-arm64-apple-clang-attempt-$RUN_ATTEMPT")
          dep_windows=$(artifact_id "cup-dependency-evidence-windows-x64-ucrt64-attempt-$RUN_ATTEMPT")
          src_linux_x64=$(artifact_id "cup-source-evidence-linux-x64-attempt-$RUN_ATTEMPT")
          src_linux_arm64=$(artifact_id "cup-source-evidence-linux-arm64-attempt-$RUN_ATTEMPT")
          src_macos_x64=$(artifact_id "cup-source-evidence-macos-x64-attempt-$RUN_ATTEMPT")
          src_macos_arm64=$(artifact_id "cup-source-evidence-macos-arm64-attempt-$RUN_ATTEMPT")
          src_windows=$(artifact_id "cup-source-evidence-windows-x64-attempt-$RUN_ATTEMPT")
          matrix=$(jq -cn \
            --arg dlx "$dep_linux_x64" --arg dla "$dep_linux_arm64" \
            --arg dmx "$dep_macos_x64" --arg dma "$dep_macos_arm64" \
            --arg dw "$dep_windows" --arg slx "$src_linux_x64" \
            --arg sla "$src_linux_arm64" --arg smx "$src_macos_x64" \
            --arg sma "$src_macos_arm64" --arg sw "$src_windows" \
            '{include:[
              {
                platform:"linux-x64",
                runner:"ubuntu-24.04",
                family:"linux",
                profile:"gcc",
                dependency_target:"linux-x64-gcc",
                compiler:"gcc",
                windres:"windres",
                dependency_artifact_id:$dlx,
                source_artifact_id:$slx
              },
              {
                platform:"linux-arm64",
                runner:"ubuntu-24.04-arm",
                family:"linux",
                profile:"gcc",
                dependency_target:"linux-arm64-gcc",
                compiler:"gcc",
                windres:"windres",
                dependency_artifact_id:$dla,
                source_artifact_id:$sla
              },
              {
                platform:"macos-x64",
                runner:"macos-15-intel",
                family:"macos",
                profile:"apple-clang",
                dependency_target:"macos-x64-apple-clang",
                compiler:"clang",
                windres:"windres",
                dependency_artifact_id:$dmx,
                source_artifact_id:$smx
              },
              {
                platform:"macos-arm64",
                runner:"macos-15",
                family:"macos",
                profile:"apple-clang",
                dependency_target:"macos-arm64-apple-clang",
                compiler:"clang",
                windres:"windres",
                dependency_artifact_id:$dma,
                source_artifact_id:$sma
              },
              {
                platform:"windows-x64",
                runner:"windows-2025",
                family:"windows",
                profile:"ucrt64-gcc",
                dependency_target:"windows-x64-ucrt64",
                compiler:"gcc",
                windres:"windres",
                dependency_artifact_id:$dw,
                source_artifact_id:$sw
              }
            ]}')
          echo "candidate_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "index_sha256=$(sha256sum "$index" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  common:
    name: Build common release assets
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
      - name: Build exact common asset set
        env:
          CUP_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          CUP_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          CUP_RELEASE_COMMIT: ${{ needs.metadata.outputs.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          TESTS_RUN_ID: ${{ needs.metadata.outputs.tests_run_id }}
          TESTS_RUN_ATTEMPT: ${{ needs.metadata.outputs.tests_run_attempt }}
          TESTS_EVIDENCE_INDEX_SHA256: ${{ needs.metadata.outputs.tests_evidence_index_sha256 }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: make release-common-assets
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cup-release-common-attempt-${{ github.run_attempt }}
          path: build/release/common/public
          if-no-files-found: error
          retention-days: 30

  candidate:
    name: Build and test candidate (${{ matrix.platform }})
    needs:
      - metadata
      - common
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.candidate_matrix) }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2.32.0
        if: matrix.family == 'windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            ca-certificates
            curl
            file
            git
            gcc
            make
            openssl
            perl
            tar
            xz
          pacboy: >-
            gcc:p
            binutils:p
            pkgconf:p

      - name: Prepare POSIX release toolchain
        if: matrix.family != 'windows'
        env:
          FAMILY: ${{ matrix.family }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/ci/prepare-posix.sh release

      - id: cache-posix
        if: matrix.family != 'windows'
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          root="$HOME/deps/${{ matrix.platform }}"
          key=$(scripts/dependencies/verify.sh '${{ matrix.platform }}' --print-cache-key)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - id: cache-windows
        if: matrix.family == 'windows'
        shell: msys2 {0}
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          root="$HOME/deps/windows-x64"
          key=$(scripts/dependencies/verify.sh windows-x64 --print-cache-key)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "prefix=$root/install" >> "$GITHUB_OUTPUT"
          echo "cache_root=$(cygpath -m "$root")" >> "$GITHUB_OUTPUT"
          echo "cache_prefix=$(cygpath -m "$root/install")" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5.0.5
        if: matrix.family != 'windows'
        with:
          path: |
            ${{ steps.cache-posix.outputs.root }}/.cup-dependencies-root
            ${{ steps.cache-posix.outputs.prefix }}
          key: ${{ steps.cache-posix.outputs.key }}
          fail-on-cache-miss: true

      - uses: actions/cache@v5.0.5
        if: matrix.family == 'windows'
        with:
          path: |
            ${{ steps.cache-windows.outputs.cache_root }}/.cup-dependencies-root
            ${{ steps.cache-windows.outputs.cache_prefix }}
          key: ${{ steps.cache-windows.outputs.key }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ matrix.dependency_artifact_id }}
          path: ${{ runner.temp }}/cup-release-inputs/evidence/dependencies/${{ matrix.dependency_target }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.metadata.outputs.tests_run_id }}

      - uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ matrix.source_artifact_id }}
          path: ${{ runner.temp }}/cup-release-inputs/evidence/source/${{ matrix.platform }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.metadata.outputs.tests_run_id }}

      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-common-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cup-release-inputs/common

      - name: Verify and build POSIX candidate
        if: matrix.family != 'windows'
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
          DEPS_ROOT: ${{ steps.cache-posix.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache-posix.outputs.prefix }}
          CUP_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          CUP_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          CUP_RELEASE_COMMIT: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/cup-release-inputs"
          dependency_evidence_name='cup-dependency-evidence-${{ matrix.dependency_target }}-attempt-'
          dependency_evidence_name=$dependency_evidence_name'${{ needs.metadata.outputs.tests_run_attempt }}'
          scripts/ci/verify-dependency-evidence.sh \
            "$inputs/evidence/dependencies/${{ matrix.dependency_target }}/evidence.txt" \
            '${{ matrix.dependency_target }}' '${{ matrix.platform }}' \
            '${{ matrix.profile }}' "$DEPS_PREFIX" '${{ github.repository }}' \
            '${{ needs.metadata.outputs.sha }}' '${{ needs.metadata.outputs.tests_run_id }}' \
            '${{ needs.metadata.outputs.tests_run_attempt }}' \
            "$dependency_evidence_name"
          make PLATFORM='${{ matrix.platform }}' CC='${{ matrix.compiler }}' \
            DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            RELEASE_COMMON_DIR="$inputs/common" release-candidate
          scripts/ci/verify-source-evidence.sh \
            "$inputs/evidence/source/${{ matrix.platform }}" '${{ matrix.platform }}' \
            '${{ github.repository }}' '${{ needs.metadata.outputs.sha }}' \
            '${{ needs.metadata.outputs.tests_run_id }}' '${{ needs.metadata.outputs.tests_run_attempt }}' \
            'cup-source-evidence-${{ matrix.platform }}-attempt-${{ needs.metadata.outputs.tests_run_attempt }}' \
            build/finalized/${{ matrix.platform }}/release/build-config.txt

      - name: Verify and build Windows candidate
        if: matrix.family == 'windows'
        shell: msys2 {0}
        env:
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
          DEPS_ROOT: ${{ steps.cache-windows.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache-windows.outputs.prefix }}
          CUP_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          CUP_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          CUP_RELEASE_COMMIT: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          inputs=$(cygpath -u "$RUNNER_TEMP")/cup-release-inputs
          dependency_evidence_name='cup-dependency-evidence-${{ matrix.dependency_target }}-attempt-'
          dependency_evidence_name=$dependency_evidence_name'${{ needs.metadata.outputs.tests_run_attempt }}'
          scripts/ci/verify-dependency-evidence.sh \
            "$inputs/evidence/dependencies/${{ matrix.dependency_target }}/evidence.txt" \
            '${{ matrix.dependency_target }}' windows-x64 '${{ matrix.profile }}' "$DEPS_PREFIX" \
            '${{ github.repository }}' '${{ needs.metadata.outputs.sha }}' \
            '${{ needs.metadata.outputs.tests_run_id }}' '${{ needs.metadata.outputs.tests_run_attempt }}' \
            "$dependency_evidence_name"
          make PLATFORM=windows-x64 CC=gcc WINDRES=windres \
            DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            RELEASE_COMMON_DIR="$inputs/common" release-candidate
          scripts/ci/verify-source-evidence.sh \
            "$inputs/evidence/source/windows-x64" windows-x64 \
            '${{ github.repository }}' '${{ needs.metadata.outputs.sha }}' \
            '${{ needs.metadata.outputs.tests_run_id }}' '${{ needs.metadata.outputs.tests_run_attempt }}' \
            'cup-source-evidence-windows-x64-attempt-${{ needs.metadata.outputs.tests_run_attempt }}' \
            build/finalized/windows-x64/release/build-config.txt

      - name: Assemble and test POSIX candidate
        if: matrix.family != 'windows'
        env:
          DEPS_ROOT: ${{ steps.cache-posix.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache-posix.outputs.prefix }}
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/cup-release-inputs"
          candidate="$RUNNER_TEMP/cup-release-${{ matrix.platform }}"
          scripts/release/assemble-candidate.sh "$candidate" \
            "$inputs/common" \
            "$PWD/build/release/platforms/${{ matrix.platform }}/public"
          make PLATFORM='${{ matrix.platform }}' CC='${{ matrix.compiler }}' \
            DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            CUP_TEST_CONFIGURATION=release RELEASE_DIR="$candidate" test-release

      - name: Assemble and test Windows candidate
        if: matrix.family == 'windows'
        shell: msys2 {0}
        env:
          DEPS_ROOT: ${{ steps.cache-windows.outputs.root }}
          DEPS_PREFIX: ${{ steps.cache-windows.outputs.prefix }}
          CUP_DEPENDENCY_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          inputs=$(cygpath -u "$RUNNER_TEMP")/cup-release-inputs
          candidate="$RUNNER_TEMP/cup-release-windows-x64"
          scripts/release/assemble-candidate.sh "$candidate" \
            "$inputs/common" \
            "$PWD/build/release/platforms/windows-x64/public"
          make PLATFORM=windows-x64 CC=gcc WINDRES=windres \
            DEPS_ROOT="$DEPS_ROOT" DEPS_PREFIX="$DEPS_PREFIX" \
            CUP_TEST_CONFIGURATION=release RELEASE_DIR="$candidate" test-release

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cup-release-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: build/release/platforms/${{ matrix.platform }}/public
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cup-symbols-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: build/release/platforms/${{ matrix.platform }}/symbols
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish exact candidate
    needs:
      - metadata
      - common
      - candidate
    if: ${{ needs.candidate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-common-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cup-release-downloads/common
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-linux-x64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cup-release-downloads/linux-x64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-linux-arm64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cup-release-downloads/linux-arm64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-macos-x64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cup-release-downloads/macos-x64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-macos-arm64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cup-release-downloads/macos-arm64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cup-release-windows-x64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cup-release-downloads/windows-x64

      - name: Assemble exact flat candidate
        run: |
          set -euo pipefail
          scripts/release/assemble-candidate.sh "$RUNNER_TEMP/cup-release-candidate" \
            "$RUNNER_TEMP/cup-release-downloads/common" \
            "$RUNNER_TEMP/cup-release-downloads/linux-x64" \
            "$RUNNER_TEMP/cup-release-downloads/linux-arm64" \
            "$RUNNER_TEMP/cup-release-downloads/macos-x64" \
            "$RUNNER_TEMP/cup-release-downloads/macos-arm64" \
            "$RUNNER_TEMP/cup-release-downloads/windows-x64"

      - name: Publish or resume release
        env:
          GH_TOKEN: ${{ secrets.CUP_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ vars.CUP_RELEASE_REPOSITORY || github.repository }}
          RELEASE_TARGET: ${{ vars.CUP_RELEASE_TARGET }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
          SHA: ${{ needs.metadata.outputs.sha }}
          TESTS_RUN_ID: ${{ needs.metadata.outputs.tests_run_id }}
          TESTS_RUN_ATTEMPT: ${{ needs.metadata.outputs.tests_run_attempt }}
          TESTS_EVIDENCE_INDEX_SHA256: ${{ needs.metadata.outputs.tests_evidence_index_sha256 }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: scripts/release/publish.sh "$RUNNER_TEMP/cup-release-candidate"
